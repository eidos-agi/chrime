[package]
name = "chrime"
version = "0.1.0"
edition = "2021"
description = "A browser built for AI agents: dual-pane GUI by default (human+AI co-surf), full JSON API, lean core optional."
license = "MIT"

# ---------------------------------------------------------------------------
# Default = GUI (dual-pane). Most real work needs a human in the loop to help
# the agent surf; the window is the co-browsing surface. API still drives 100%.
#
# Lean headless (no wry/winit):
#   cargo build --release --no-default-features
#
# Full JS engine (heavy):
#   cargo build --release --features servo
# ---------------------------------------------------------------------------

[dependencies]
ureq = "2.10"                                    # tiny sync HTTP; no async runtime
scraper = "0.20"                                 # html5ever + selectors (page walk)
url = "2.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Desktop shell (WebKit dual-pane) — default feature
wry = { version = "0.55", optional = true }
winit = { version = "0.30", optional = true }

# Optional v1 engine (ADR 0001)
servo = { git = "https://github.com/servo/servo", rev = "aa297ce5", optional = true }
dpi = { version = "=0.1.2", optional = true }
rustls = { version = "0.23", features = ["ring"], optional = true }

[features]
default = ["gui"]
gui = ["dep:wry", "dep:winit"]
servo = ["dep:servo", "dep:dpi", "dep:rustls"]

[profile.release]
opt-level = "z"
lto = true
strip = true
